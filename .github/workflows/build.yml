name: Build TWRP Y91c


on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Recovery Compilation
        uses: NevtBotz/Recovery-Compiler@beta
        env:
          MANIFEST: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni -b twrp-9.0"
          DT_LINK: "https://github.com/NevtBotz/android_device_vivo_PD1818HF_EX"
          VENDOR: "vivo"
          CODENAME: "PD1818HF_EX"
          KERNEL_LINK: ""
          TARGET: "recoveryimage"
          FLAVOR: "eng"
          EXTRA_CMD: "sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5; sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5; sudo add-apt-repository universe; sudo apt-get update -qq && sudo apt-get install -y -qq python2 python-is-python2"
          TZ: "Asia/Makassar"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery
          path: work/out/target/product/PD1818HF_EX/recovery.img

